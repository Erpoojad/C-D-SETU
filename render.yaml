# Render Blueprint — https://render.com/docs/blueprint-spec
# C&D Setu is a client-side Vite/React app, so it deploys as a free static site.
services:
  - type: web
    name: cd-setu
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
