# Render Blueprint — https://render.com/docs/blueprint-spec
# One Node web service (API + built frontend) and one Postgres database.
services:
  - type: web
    name: cd-setu
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: cd-setu-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: AUTHORITY_INVITE_CODE
        sync: false
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: cd-setu-db
    region: singapore
    plan: free
